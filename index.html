.hl{color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht{height:10px}
.ht i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--series);opacity:.85}
.hb:hover .ht i{opacity:1}
.hb b{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-columns:40px repeat(var(--cols),minmax(0,1fr));gap:3px;font-size:12px}
.hx{padding-bottom:4px;color:var(--t3);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hy{display:flex;align-items:center;color:var(--t2);font-weight:500}
.hc{display:grid;place-items:center;height:38px;border-radius:6px;font-weight:600;font-variant-numeric:tabular-nums;outline:none;color:var(--t1)}
.hc:focus-visible{box-shadow:0 0 0 2px var(--sky)}
.hc.h0{background:var(--h0);color:var(--t3)}.hc.h1{background:var(--h1)}.hc.h2{background:var(--h2)}.hc.h3{background:var(--h3);color:#fff}.hc.h4{background:var(--h4);color:#fff}.hc.h5{background:var(--h5);color:#fff}
[data-theme=dark] .hc.h1,[data-theme=dark] .hc.h2{color:#fff}[data-theme=dark] .hc.h4,[data-theme=dark] .hc.h5{color:#0b1b33}
.hscale{display:flex;align-items:center;gap:3px;margin-top:12px;font-size:11.5px;color:var(--t3)}
.hscale i{width:22px;height:8px;border-radius:2px}
.hscale span:first-child{margin-right:4px}.hscale span:last-child{margin-left:4px}
.hscale .h1{background:var(--h1)}.hscale .h2{background:var(--h2)}.hscale .h3{background:var(--h3)}.hscale .h4{background:var(--h4)}.hscale .h5{background:var(--h5)}
.mini-tbl{overflow:auto;max-height:320px}
.mini-tbl table{width:100%;border-collapse:collapse;font-size:13px}
.mini-tbl th{position:sticky;top:0;padding:8px 10px;text-align:left;font-weight:500;color:var(--t2);background:var(--s2);border-bottom:1px solid var(--line);white-space:nowrap}
.mini-tbl td{padding:9px 10px;border-bottom:1px solid var(--line)}
.mini-tbl tr:last-child td{border-bottom:0}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.w40{width:40%}.w30{width:30%}
.sub{display:block;margin-top:2px;font-size:12px;color:var(--t3);font-weight:400}
.cellbar{position:relative;display:flex;align-items:center;gap:10px}
.cellbar i{display:block;height:6px;border-radius:3px;background:var(--series);opacity:.8;flex:none;max-width:calc(100% - 84px)}
.cellbar b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.rowbtn{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:10px 8px;margin-inline:-8px;width:calc(100% + 16px);border-radius:8px;border-top:0;text-align:left;font-size:13.5px}
.rowbtn:first-of-type{margin-top:0}
.rowbtn:hover{background:var(--hover)}
.rowbtn:hover strong{text-decoration:none}
.rowbtn>span:first-child{color:var(--t2)}
.rowbtn strong{color:var(--t1)}
.rowbtn .r small{font-size:12.5px;color:var(--t2)}
.st{gap:4px;border-radius:6px;background:var(--hover)}
.st svg{flex:none}
.st-delivered,.st-approved{color:var(--ok);background:var(--goodbg)}
.st-hot{color:var(--urgent);background:var(--urgbg)}
.st-received,.st-certificate-check,.st-packed,.st-in-transit{color:var(--brand);background:var(--brand2)}
.st-waiting-for-review{color:var(--brand);background:var(--brand2)}
.st-expires-in-30-days{color:var(--warn);background:var(--warnbg)}
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:12px}
.fchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:999px;font-size:13px;color:var(--t2);box-shadow:inset 0 0 0 1px var(--line2);transition:background .15s,color .15s}
.fchip b{font-weight:600;color:var(--t3);font-variant-numeric:tabular-nums}
.fchip:hover{color:var(--t1);background:var(--hover)}
.fchip.on{color:var(--t1);background:var(--brand2);box-shadow:inset 0 0 0 1.5px var(--btn)}
.fchip.on b{color:var(--brand)}
.fchip.hot.on{background:var(--urgbg);box-shadow:inset 0 0 0 1.5px var(--urgent);color:var(--urgent)}
.fsel{height:32px;padding:0 10px;border:0;border-radius:999px;background:transparent;box-shadow:inset 0 0 0 1px var(--line2);font-size:13px;color:var(--t1)}
.fsel option{color:#111;background:#fff}
.fhint{margin-left:auto}
.tbl{border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);max-height:calc(100vh - 230px)}
.tbl th{z-index:1;border-bottom:1px solid var(--line)}
.tbl td{border-top:0;border-bottom:1px solid var(--line)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tr.grp td{border-top:1px solid var(--line2)}
.tbl tbody tr:first-child td{border-top:0}
.tbl tr[data-order]{outline:none}
.tbl tr[data-order]:focus-visible td{background:var(--hover);box-shadow:inset 0 0 0 0 var(--sky)}
.tbl tfoot td{position:sticky;bottom:0;padding:11px 14px;background:var(--s2);border-top:1px solid var(--line2);font-weight:600;color:var(--t1)}
.tbl td.r{text-align:right}
.sortb{display:inline-flex;align-items:center;gap:5px;font:inherit;color:inherit}
.sortb i{font-style:normal;color:var(--t3);font-size:11px}
.sortb.on{color:var(--t1)}
.sortb.on i{color:var(--brand)}
th.num .sortb{flex-direction:row-reverse}
.cond{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.cond i{width:7px;height:7px;border-radius:50%}
.cond.c-NE i{background:#1a9e55}.cond.c-OH i{background:#e08a1e}.cond.c-SV i{background:#1f6bff}.cond.c-AR i{background:#8e8e93}
.lv{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap}
.lv-ok{color:var(--ok);background:var(--goodbg)}.lv-low{color:var(--warn);background:var(--warnbg)}.lv-out{color:var(--urgent);background:var(--urgbg)}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:12px;font-size:13px;color:var(--t2)}
.pager span{margin-right:auto}
.ctiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.ctl{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:4px 10px;padding:14px;border-radius:14px;background:var(--s2);box-shadow:inset 0 0 0 1px var(--line);text-align:left;transition:background .15s}
.ctl svg{grid-row:span 2;color:var(--t2)}
.ctl span{font-size:13px;color:var(--t2)}
.ctl strong{font:600 22px/1 var(--display);font-variant-numeric:tabular-nums}
.ctl:hover{background:var(--s3)}
.ctl.on{background:var(--brand2);box-shadow:inset 0 0 0 1.5px var(--btn)}
.ctl.on svg{color:var(--brand)}
.cardsA{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.aogc{display:flex;flex-direction:column;gap:6px}
.aogc.done{opacity:.6}
.aogco{font-weight:500}
.sla{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;height:26px;margin-top:6px;padding:0 9px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--brand);background:var(--brand2)}
.sla.late{color:var(--urgent);background:var(--urgbg)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px;list-style:none}
.steps li{height:4px;border-radius:2px;background:var(--line2)}
.steps li.on{background:var(--btn)}
.acts{margin-top:auto;padding-top:10px}
.a-scrim{position:fixed;inset:0;z-index:64;background:rgba(0,0,0,.35);animation:pop .2s}
.a-drawer{padding:22px}
.aogflag{display:flex;align-items:center;gap:7px;margin-top:10px;padding:9px 11px;border-radius:9px;font-size:13px;font-weight:500;color:var(--urgent);background:var(--urgbg)}
.adl>div{align-items:center}
.adl img,.adl .ph{flex:none;width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--s3)}
.adl>div>span:nth-child(2){flex:1;min-width:0}
.adl small{display:block;font-size:12px;color:var(--t2)}
.ads{list-style:none}
.ads li{display:flex;align-items:center;gap:10px;padding:0 0 12px;color:var(--t3)}
.ads li::before{display:none}
.ads li i{display:grid;place-items:center;flex:none;width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line2);color:#fff}
.ads li.done{color:var(--t2)}.ads li.done i{background:var(--btn);box-shadow:none}
.ads li.now{color:var(--t1);font-weight:500}.ads li.now i{box-shadow:inset 0 0 0 5px var(--btn)}
.a-side nav .cnt{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;font:600 11.5px/20px var(--body);font-style:normal;text-align:center;color:#fff;background:var(--urgent)}
.tog input{appearance:none;-webkit-appearance:none;position:relative;width:40px;height:24px;border-radius:12px;background:var(--line2);cursor:pointer;transition:background .2s}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s var(--ease)}
.tog input:checked{background:var(--btn)}
.tog input:checked::after{transform:translateX(16px)}
.tog input:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
@media (max-width:1200px){.dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.ctiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .dgrid{grid-template-columns:minmax(0,1fr)}.dgrid .span2{grid-column:auto}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px}
  .kpi{padding:12px 12px 0}.kpi strong{font-size:22px}.spark{margin-inline:-12px}
  .ph{flex-wrap:wrap}.legend{order:3;width:100%}
  .a-main{padding:16px 12px 40px}
  .fhint{display:none}
  .tbl{max-height:none}
  .a-search{width:100%}
  .heat{grid-template-columns:34px repeat(var(--cols),minmax(0,1fr))}
  .hc{height:32px;font-size:11px}
  .hx{font-size:10.5px}
  .pipe li{grid-template-columns:104px minmax(0,1fr) 24px}
  .a-drawer{width:100vw}
}

/* Static fallback: reduced motion or no WebGL */
.static .story{height:auto}
.static .stage{position:relative;height:auto;min-height:100vh;overflow:visible;padding-bottom:64px}
.static .gl,.static .hotspots,.static .scrim{display:none}
.static .poster{opacity:1;height:100vh}
[data-theme=light].static .poster{mix-blend-mode:multiply;filter:invert(1) hue-rotate(180deg) contrast(.92)}
.static .hero{position:relative;min-height:100vh;opacity:1!important;transform:none!important}
.static .beat1,.static .beat2,.static .chapter{position:relative;inset:auto;translate:none;opacity:1!important;transform:none!important;width:auto;margin:48px auto 0;padding-inline:var(--gut);max-width:1000px;text-align:start}
.static .chapter{pointer-events:auto}

/* Mobile menu */
#menuBtn{display:none}
.sheet{margin:0;margin-inline-start:auto;padding:0;border:0;width:min(400px,100vw);height:100dvh;max-height:none;max-width:none;background:var(--bg);color:var(--t1);box-shadow:inset 1px 0 0 var(--line)}
.m-links{display:flex;flex-direction:column;padding:8px 12px}
.m-links a,.m-links .m-link{display:flex;align-items:center;min-height:56px;padding:0 12px;border-bottom:1px solid var(--line);font:500 22px/1 var(--display);letter-spacing:-.02em;text-align:start}
.m-links a:active,.m-links .m-link:active{background:var(--hover)}
.m-set{display:grid;gap:4px;padding:20px 24px}
.m-set>div{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.m-set span{color:var(--t2);font-size:15px}
.m-set .outline{height:44px;font-size:14px;background:none;color:var(--t1);border:0;padding:0 16px}

/* Added-to-cart toast */
.toast{position:fixed;z-index:46;bottom:20px;left:50%;display:flex;align-items:center;gap:12px;width:min(440px,calc(100vw - 24px));padding:10px 10px 10px 10px;border-radius:18px;background:var(--pop);backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%);box-shadow:inset 0 0 0 1px var(--line2),var(--shadow);transform:translate(-50%,24px);opacity:0;transition:transform .35s var(--ease),opacity .25s}
.toast.on{transform:translate(-50%,0);opacity:1}
.toast img{flex:none;width:48px;height:48px;border-radius:10px;object-fit:cover;background:#c9cacd}
.toast div{flex:1;min-width:0}
.toast strong{display:block;font-size:14px;font-weight:600}
.toast span{display:block;margin-top:2px;font-size:13px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.fab.dodge{opacity:0;pointer-events:none;transform:translateY(12px)}

/* Hero: the engine as a hairline drawing behind the type */
.stage::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(0deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 70%,transparent) 26%,transparent 55%)}
.story .hero{position:absolute;z-index:2;inset:auto;inset-block-end:clamp(56px,10vh,104px);inset-inline-start:max(var(--gut),calc((100vw - 1400px)/2 + var(--gut)));display:block;width:min(600px,calc(100vw - var(--gut)*2));padding:0;text-align:start}
.story .hero .kick{font-size:14px;font-weight:500;color:var(--sky)}
.story .hero h1{margin-top:14px;max-width:none;font-size:clamp(46px,min(6vw,10vh),88px);line-height:1;letter-spacing:-.04em}
[dir=rtl] .story .hero h1{letter-spacing:0;line-height:1.2;font-size:clamp(40px,min(5vw,9vh),76px)}
.story .lede{margin-top:18px;max-width:27em;font-size:clamp(16px,1.3vw,19px)}
.story .searchpill{margin-top:26px;width:min(520px,100%)}
.story .hero-links{justify-content:flex-start;margin-top:4px}
.facts{position:absolute;z-index:2;max-width:calc(100vw - 720px);inset-inline-end:max(var(--gut),calc((100vw - 1400px)/2 + var(--gut)));bottom:clamp(64px,11vh,112px);display:flex;gap:clamp(28px,3.4vw,52px);list-style:none}
.facts b{display:block;font:600 clamp(20px,1.8vw,26px)/1.1 var(--display);letter-spacing:-.02em;white-space:nowrap}
.facts span{display:block;margin-top:5px;max-width:12em;font-size:13px;line-height:1.35;color:var(--t2)}
.story .beat2{z-index:2;inset:auto;inset-block-end:clamp(56px,10vh,104px);inset-inline-start:max(var(--gut),calc((100vw - 1400px)/2 + var(--gut)));width:min(560px,calc(100vw - var(--gut)*2));text-align:start}
.story .beat2 p{margin:16px 0 0;max-width:26em}
.story .beat2 .jump{margin-top:24px;height:46px;padding:0 20px;font-size:15px}
.story .hotspots{z-index:2}
.story .hs button{font-size:12.5px;height:30px;padding:0 12px}
.static .story .hero{position:absolute;min-height:0}
.static .story .beat,.static .story .hotspots{display:none}
.static .poster{object-position:70% 50%;opacity:.9}

/* Brand accents */
.logo svg{color:var(--brand)}
.pd-pn strong,.d1 em{color:var(--brand)}
.hero-links{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 22px}
.hero-links .textbtn:first-child{color:var(--t1)}

/* Proof */
.proof{background:var(--s1)}
.appr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.appr div{display:flex;flex-direction:column;gap:6px;padding:24px;border-radius:20px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.appr strong{font:600 28px/1 var(--display);letter-spacing:-.02em;color:var(--brand)}
.appr span{font-size:14.5px;line-height:1.4;color:var(--t1)}
.appr code{margin-top:auto;padding-top:14px;font:400 12.5px/1 "Courier Prime",monospace;color:var(--t3)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-block:clamp(40px,5vw,72px);border-block:1px solid var(--line)}
.stats div{padding:clamp(24px,3vw,40px) 24px;border-inline-start:1px solid var(--line)}
.stats div:first-child{border-inline-start:0;padding-inline-start:0}
.stats strong{display:block;font:500 clamp(40px,4.6vw,68px)/1 var(--display);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.stats span{display:block;margin-top:10px;font-size:15px;color:var(--t2)}
.quotes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.quotes figure{display:flex;flex-direction:column;justify-content:space-between;gap:28px;padding:28px;border-radius:20px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.quotes blockquote{font:400 19px/1.45 var(--display);letter-spacing:-.01em;text-wrap:pretty}
[dir=rtl] .quotes blockquote{letter-spacing:0;line-height:1.75;font-size:18px}
.quotes figcaption{display:flex;flex-direction:column;gap:2px;padding-top:18px;border-top:1px solid var(--line);font-size:14px}
.quotes figcaption span{color:var(--t2)}

/* Contact */
.contact{background:var(--bg)}
.cgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ccard{display:flex;flex-direction:column;gap:10px;min-height:200px;padding:24px;border-radius:20px;background:var(--s2);transition:background .25s,transform .3s var(--ease)}
.ccard:hover{background:var(--s3);transform:translateY(-2px)}
.ccard span{font-size:14px;color:var(--t2)}
.ccard strong{font:500 21px/1.25 var(--display);letter-spacing:-.015em;overflow-wrap:anywhere}
.ccard em{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font-style:normal;font-size:14px;font-weight:500;color:var(--brand)}
[dir=rtl] .ccard em svg{transform:scaleX(-1)}
.ccard.hot{background:var(--btn);color:var(--btnt)}
.ccard.hot span{color:inherit;opacity:.72}
.ccard.hot em{color:inherit}
.ccard.hot:hover{background:var(--btnh)}
.legal p{margin-top:12px;font-size:15px;line-height:1.55;color:var(--t2)}
.foot-end{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px}
.a-btn.ghosty{background:none;color:inherit;box-shadow:inset 0 0 0 1px var(--line2)}
.a-h .a-btn.ghosty{margin-inline-start:auto}

/* Icons: one 24px line set, 1.5px stroke, sized to the text they sit with */
.trust div>svg{display:block;width:24px;height:24px;margin-bottom:14px;color:var(--brand)}
.tile>svg{flex:none;width:26px;height:26px;margin-bottom:22px;color:var(--brand)}
.shiprows div{grid-template-columns:20px 120px 1fr;align-items:start}
.shiprows div>svg{width:20px;height:20px;margin-top:1px;color:var(--t2)}
.ci{display:block;width:22px;height:22px;margin-bottom:6px;color:var(--brand)}
.ccard.hot .ci{color:inherit}
.m-links a svg,.m-links .m-link svg{flex:none;width:22px;height:22px;margin-inline-end:16px;color:var(--t2)}
.bb-ship svg{flex:none;width:18px;height:18px;margin-top:0;color:var(--ok)}
.bb-ship.out svg{color:var(--t2)}
.bb-ship i{display:none}
.bb-proof{display:grid;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);list-style:none}
.bb-proof li{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--t1)}
.bb-proof svg{flex:none;width:18px;height:18px;color:var(--t2)}

/* Brand marks: monochrome, same optical weight, never louder than the content */
.lg{display:block;width:auto;flex:none;color:var(--t2);transition:color .2s}
.ops{margin-bottom:clamp(36px,4vw,56px)}
.ops p{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--sky);margin-bottom:18px}
[dir=rtl] .ops p{letter-spacing:0}
.lgrow{display:flex;flex-wrap:wrap;align-items:center;gap:20px clamp(28px,4.5vw,64px)}
.lgrow .lg{opacity:.8}
.lgrow .lg:hover{opacity:1;color:var(--t1)}
.members{margin:clamp(28px,3vw,44px) 0 0}
.lgrow.sm{gap:18px 40px}
.tm{font:700 22px/1 var(--display);letter-spacing:.02em;color:var(--t2);opacity:.85}
.paymarks{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;margin-top:22px}
.paymarks .lg{color:var(--t2)}
.cargo{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.cargo span{display:block;font-size:12.5px;color:var(--t3);margin-bottom:12px}
.cargo div{display:flex;align-items:center;gap:22px}
.foot-pay{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;margin-top:40px}
.foot-pay .lg{color:var(--t3)}
.concept{margin-top:14px;font-size:12px;line-height:1.5;color:var(--t3);max-width:60em}

@media (max-width:1240px){
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .t-inv,.t-lang,.t-air,.t-pay{grid-column:span 6}.t-zone{grid-column:span 12}
  .minis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .links{gap:18px}
}
@media (max-width:1040px){
  .links{display:none}
  #menuBtn{display:inline-flex}
  .nav-in{grid-template-columns:auto 1fr}
  .shop{grid-template-columns:minmax(0,1fr)}
  .mfilters{display:inline-flex}
  .side{position:fixed;z-index:45;inset:0;top:auto;height:82dvh;max-height:none;padding:18px 20px 90px;border-radius:22px 22px 0 0;background:var(--bg);box-shadow:0 -30px 70px rgba(0,0,0,.4);transform:translateY(102%);transition:transform .42s var(--ease);visibility:hidden}
  .side.open{transform:none;visibility:visible}
  .fclose{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font:500 22px/1 var(--display)}
  .side-actions{display:block;position:fixed;inset:auto 0 0;padding:12px 20px 16px;background:var(--bg);border-top:1px solid var(--line)}
  .side-actions .solid{width:100%}
  .trace-grid,.faq-grid,.pd-main,.docg,.a-grid{grid-template-columns:minmax(0,1fr)}
  .gal{position:static}
  .life{padding-top:0}
  .beat1{top:clamp(80px,12vh,120px);translate:none;width:auto;inset-inline-end:var(--gut)}
  .scrim{background:linear-gradient(0deg,var(--scrim1),var(--scrim2) 28%,transparent 54%)!important}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .appr,.cgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .quotes{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .admin{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .a-side{flex-direction:row;align-items:center;gap:8px;padding:8px 10px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);scrollbar-width:none}
  .a-side .logo span,.a-back{display:none}
  .a-side nav{display:flex}
  .a-side nav button{white-space:nowrap}
  .a-side nav svg{display:none}
  .a-h{flex-wrap:wrap}
  .trust{grid-template-columns:repeat(2,minmax(0,1fr))}
  .trust div{padding:16px 14px;border-inline-start:0;border-top:1px solid var(--line)}
  .trust div:nth-child(-n+2){border-top:0}
  .trust div:nth-child(odd){padding-inline-start:0}
  .spec{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  body{font-size:16px}
  .nav-in{height:54px;gap:4px;padding-inline:14px}
  .logo span{font-size:15px}
  .ghost{padding:0 6px;font-size:12px}
  #themeBtn,#curSel,#langBtn{display:none}
  .ghost.icon{width:40px;height:40px}
  .toast{bottom:14px}
  .tools .solid{margin-inline-start:2px;padding:0 10px}
  .story{height:190vh}
  .hero{padding-top:86px}
  h1.breaks{white-space:normal}
  .searchpill{height:52px}
  kbd{display:none}
  .fab span{display:none}
  .fab{padding:0;width:48px;height:48px;justify-content:center;bottom:14px;inset-inline-end:14px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .ctile{gap:10px;min-height:64px;padding:10px}
  .ct-tx strong{font-size:14px}
  .ci2{width:40px;height:40px;border-radius:11px}.ci2 svg{width:26px;height:26px}
  /* Phone card: one left edge for all text, photo matches the text block */
  .grid,.grid.as-list{grid-template-columns:minmax(0,1fr);gap:10px}
  .viewt{display:none}
  .card,.as-list .card{display:grid;grid-template-columns:104px minmax(0,1fr);grid-template-rows:auto 1fr;column-gap:14px;padding:12px;border-radius:20px;align-items:start}
  .card .c-photo,.as-list .c-photo{grid-row:1/3;grid-column:1;align-self:stretch;width:104px;min-height:104px;aspect-ratio:auto;margin:0;border-radius:12px}
  .c-head,.as-list .c-head{grid-column:2;padding:2px 0 0}
  .c-head .pn{font:500 12.5px/1.2 var(--body);letter-spacing:.01em;color:var(--t2)}
  .card h3{margin-top:3px;font:600 16px/1.25 var(--display);letter-spacing:-.01em}
  [dir=rtl] .card h3{font-size:15.5px;line-height:1.45}
  .c-head .fits{margin-top:2px;font-size:13px;color:var(--t2)}
  .c-buy,.as-list .c-buy{grid-column:2;align-self:end;align-items:flex-end;gap:10px;margin:0;padding:12px 0 0}
  .c-pr{gap:2px}
  .c-st{font-size:12.5px}
  .c-price{font-size:18px}
  .c-add{width:38px;height:38px;margin-bottom:-1px}
  .c-add svg{width:18px;height:18px}
  .c-quote2{height:34px;padding:0 13px;font-size:13px}
  [dir=rtl] .c-head .pn{text-align:right}
  .c-pr{min-width:0;flex:1}
  .c-q{font-size:12.5px}
  .aogr{inset-inline-start:6px;top:6px;height:20px;padding:0 7px 0 5px;font-size:10.5px}
  .soldout{inset-inline-start:6px;bottom:6px;height:20px;padding:0 7px;font-size:10.5px;gap:5px}
  .soldout::before{width:5px;height:5px}
  .minis{grid-template-columns:minmax(0,1fr)}
  .chip{top:7px;inset-inline-start:7px;height:23px;padding:0 8px;font-size:11px}
  .in-search{order:3;flex-basis:100%;max-width:none}
  .chapter{bottom:28px}
  .chapter p{font-size:15px}
  .chapter li{height:28px;font-size:12px;padding:0 10px}
  .globewrap{height:auto;display:grid}
  #globe{position:relative;height:440px;grid-row:1}
  .float{height:auto;flex-direction:column;align-items:stretch;padding-bottom:0;margin-top:-72px;grid-row:2;z-index:1}
  .ticket,.routes{width:100%}
  .bento{gap:12px}
  .tile{grid-column:1/-1!important;min-height:340px}
  .form{font-size:8.6px;padding:8px}
  .form .b{padding:3px 4px 4px;min-height:34px}
  .life li{grid-template-columns:52px 1fr}
  .life li::before{inset-inline-start:60px}
  .endcap{min-height:760px}
  .opt small.r{white-space:normal}
  .bb-p{font-size:28px}
  .cgrid{grid-template-columns:minmax(0,1fr)}
  .facts{display:none}
  .story .hero{inset-block-end:40px}
  .story .beat2{inset-block-end:48px}
  .lgrow{gap:18px 26px}
  #opsLogos .lgrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));justify-items:start;row-gap:22px}
  .lgrow .lg{height:40px}
  .lgrow.sm .lg{height:36px}
  .tm{font-size:18px}
  .shiprows div{grid-template-columns:20px minmax(0,1fr);row-gap:2px}
  .shiprows span{grid-column:2}
  .appr{gap:8px}
  .appr div{padding:16px;border-radius:16px}
  .appr strong{font-size:22px}
  .appr span{font-size:13px}
  .ccard{min-height:0}
  .stats{grid-template-columns:minmax(0,1fr)}
  .stats div{border-inline-start:0;border-top:1px solid var(--line);padding-inline:0}
  .stats div:first-child{border-top:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
}
